# 一条命令起两个服务：API(7862，SSE) + 界面(7860，Gradio)
#   docker compose up -d --build
#   docker compose logs -f api
# 模型缓存放在 named volume 里：首次启动下载一次，之后重建镜像、重启都复用。
# data/ 用 bind mount：你改 kb.json 后重启即可生效，脱敏审计日志也落在宿主机上。
services:
  api:
    build: .
    image: report-rag:latest
    command: ["python", "scripts/api.py"]
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "7862"
    ports:
      - "7862:7862"
    volumes:
      - ./data:/app/data
      - hf-cache:/models/hf
    restart: unless-stopped

  ui:
    image: report-rag:latest
    command: ["python", "scripts/app.py"]
    depends_on:
      - api
    env_file:
      - .env
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      GRADIO_INBROWSER: "0"
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - hf-cache:/models/hf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  hf-cache:
